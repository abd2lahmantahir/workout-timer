<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workout Timer</title>
<meta name="theme-color" content="#3d4a5c">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a coach's clipboard — short words, big numbers, today's job first.
   IDEA: a gym scoreboard whose whole panel lights up in the colour of the current phase.
   PICTURE: a full-width colour field with a huge ring clock, move name and how-to inside.
   COLOUR and TYPE: phase colours (red work, blue rest, purple break, green walk, orange jog, teal cool-down, slate ready); Barlow Condensed numbers, Barlow text.
   LAYOUT: scoreboard band on top, controls under it, then today's plan card and the week log. */
:root{color-scheme:light dark;--bg:light-dark(#f6f4f1,#121212);--ink:light-dark(#1b1a19,#f1eeea);--card:light-dark(#fff,#1d1c1b);--line:light-dark(#e3ddd6,#34312e);--mute:light-dark(#6c645d,#b5ada5);--acc:light-dark(#d4231b,#ff6a5c);--stage:#3d4a5c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
h1,h2{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:800;margin:0;line-height:1.05}
h1{font-size:clamp(26px,5vw,36px)}h2{font-size:26px;margin-bottom:10px}
.band{padding:clamp(18px,4vw,44px) max(5vw,16px)}
.stage{background-color:var(--stage);background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(0,0,0,.22));color:#fff;transition:background-color .6s ease;user-select:none;-webkit-user-select:none}
.wrap{max-width:900px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top p{margin:0;opacity:.9;font-weight:600}
.clockrow{display:grid;justify-items:center;margin-top:12px}
.ring{position:relative;width:min(420px,86vw);aspect-ratio:1}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:15%}
.phase{display:inline-block;justify-self:center;font:800 clamp(18px,4.4vw,26px)/1 "Barlow Condensed","Arial Narrow",Barlow,system-ui,sans-serif;letter-spacing:.03em;background:rgba(0,0,0,.22);padding:6px 14px;border-radius:999px}
.time{font:800 clamp(72px,20vw,132px)/1 "Barlow Condensed","Arial Narrow",Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums;margin-top:6px}
.what{font:800 clamp(22px,5vw,32px)/1.05 "Barlow Condensed","Arial Narrow",Barlow,system-ui,sans-serif}
.how{font-size:clamp(14px,3.2vw,17px);opacity:.92;line-height:1.25;margin-top:4px}
.next{font-size:14px;opacity:.85;margin-top:8px}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
button,input{font:inherit;font-size:16px}
.btn{min-height:50px;padding:0 22px;border-radius:999px;border:2px solid #fff;background:transparent;color:#fff;font-weight:600;cursor:pointer}
.btn.go{background:#fff;color:#1b1a19;min-width:150px;font-size:19px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,.small:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
.strip{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:20px auto 8px;max-width:760px;background:rgba(255,255,255,.18)}
.strip i{display:block;height:100%;border-right:1px solid rgba(0,0,0,.3)}
.strip i.done{opacity:.35}.strip i.now{box-shadow:inset 0 0 0 2px #fff}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:13px;opacity:.95}
.legend b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.meta{display:flex;gap:18px;justify-content:center;font-size:14px;opacity:.9;margin-top:6px;flex-wrap:wrap}
.grid{max-width:900px;margin:0 auto;display:grid;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.lbl{font-size:14px;color:var(--mute);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.today{font-weight:700}
.chip.today::after{content:" •"}
.sess{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.sess h3{font:800 24px/1.1 "Barlow Condensed","Arial Narrow",Barlow,system-ui,sans-serif;margin:0}
.sess .dur{color:var(--mute);font-size:15px;margin:2px 0 10px}
.moves{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.moves li{display:grid;grid-template-columns:10.5em minmax(0,1fr);gap:10px;padding:8px 12px;border-radius:10px;background:var(--bg)}
.moves li b{font-weight:600}
.moves li span{color:var(--mute)}
.moves li.mv{grid-template-columns:56px minmax(0,1fr);align-items:center}
.moves li.mv div{display:grid}
.mini{width:56px;height:66px;background:#fff;border-radius:8px;display:block}
.moves li.ex{grid-template-columns:minmax(0,1fr)}
@media(max-width:480px){.moves li:not(.mv){grid-template-columns:minmax(0,1fr);gap:0}}
.figbox{width:min(250px,64vw);margin:4px auto 0;background:rgba(255,255,255,.94);border-radius:18px;padding:4px 6px 8px;text-align:center}
.figbox svg{width:100%;height:auto;max-height:30vh;display:block}
.figlbl{font:600 14px/1.2 Barlow,system-ui,sans-serif;color:#5c554f}
.note{font-size:14px;color:var(--mute);margin:10px 0 0}
.rowf{display:flex;gap:16px;flex-wrap:wrap;align-items:end;margin-top:14px}
.rowf label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
input[type=date]{min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg);color:var(--ink)}
.toggles{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.toggles label{display:flex;align-items:center;gap:8px;font-size:15px}
.toggles input{width:22px;height:22px}
.small{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--acc);background:transparent;color:var(--ink);cursor:pointer;font-weight:600}
#install{display:none}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.week div{border-radius:12px;padding:8px 2px;background:var(--bg);font-size:13px;color:var(--mute)}
.week div b{display:block;font:800 20px/1.2 "Barlow Condensed","Arial Narrow",Barlow,system-ui,sans-serif;color:var(--ink)}
.week div.ok{background:#12895a;color:#fff}.week div.ok b{color:#fff}
.week div.td{box-shadow:inset 0 0 0 2px var(--acc)}
@media(prefers-reduced-motion:reduce){.stage{transition:none}.ring circle{transition:none!important}}
</style></head><body>

<section class="band stage" id="stage"><div class="wrap">
 <div class="top"><h1>Workout timer</h1><p id="sumline"></p></div>
 <div class="clockrow"><div class="ring">
  <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="10"/><circle id="arc" cx="100" cy="100" r="90" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="0" style="transition:stroke-dashoffset .25s linear"/></svg>
  <div class="in"><div class="phase" id="phase">Ready</div><div class="time" id="time">0:00</div><div class="what" id="what"></div><div class="how" id="how"></div><div class="next" id="next"></div></div>
 </div></div>
 <div class="figbox" id="figbox"><svg viewBox="0 10 120 155" aria-hidden="true"><ellipse cx="60" cy="158" rx="40" ry="3.5" fill="#e3ddd6"/><g id="bigg"></g></svg><div class="figlbl" id="figlbl"></div></div>
 <div class="ctrl"><button class="btn go" id="go">Start</button><button class="btn" id="skip">Skip</button><button class="btn" id="reset">Reset</button></div>
 <div class="strip" id="strip"></div>
 <div class="legend" id="legend"></div>
 <div class="meta"><span id="elapsed">Elapsed 0:00</span><span id="left">Left 0:00</span></div>
</div></section>

<section class="band"><div class="grid">
 <div class="card">
  <h2>Today's plan</h2>
  <div class="lbl">Plan block</div><div class="chips" id="blocks"></div>
  <div class="lbl">Day</div><div class="chips" id="days"></div>
  <div class="sess" id="sess"></div>
  <p class="note">Every day: a few more steps than last week (walk after lunch, take the stairs). On call? Tap Pause, answer, and carry on after. Stop if you feel sharp pain; mild soreness in the first weeks is normal.</p>
 </div>

 <div class="card">
  <h2>This week</h2>
  <div class="week" id="week"></div>
  <div class="rowf"><label>Plan start date<input type="date" id="start"></label><span class="note" id="wkinfo" style="margin:0"></span></div>
  <div class="toggles"><label><input type="checkbox" id="t-beep">Beeps</label><label><input type="checkbox" id="t-voice">Voice cues</label><label><input type="checkbox" id="t-vib">Vibrate</label><label><input type="checkbox" id="t-wake">Keep screen on</label><label><input type="checkbox" id="t-quiet">Quiet mode (no jumping)</label></div>
  <div class="toggles"><button class="small" id="install">Install as app</button></div>
 </div>
</div></section>

<script>
{
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('wt2-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('wt2-'+k,JSON.stringify(v))}catch(e){}}};

/* phase colours */
const COL={ready:'#3d4a5c',work:'#d4231b',rest:'#1f6fd1',brk:'#6a3fc1',walk:'#12895a',jog:'#e0620d',cardio:'#e0620d',warm:'#2f8f5b',cool:'#0f7f86',done:'#2b2623'};
const NAME={ready:'Get ready',work:'Work',rest:'Rest',brk:'Round break',walk:'Walk',jog:'Jog',cardio:'Cardio',warm:'Warm-up',cool:'Cool-down',done:'Done'};

/* hybrid circuit: strength (S) and cardio (C) alternate */
const MOVES=[
 {n:'Squat',t:'S',a:'squat',full:'Slow 3-second squat',adv:'Jump squat or Bulgarian split squat (switch legs halfway)',advQ:'Pulse squat: stay low, small bounces',hAdv:1},
 {n:'Jumping jacks',t:'C',a:'jj',full:'Steady rhythm, land softly',adv:'Star jumps',q:'Step-jacks: step out one foot at a time, arms up'},
 {n:'Push-up',t:'S',a:'pushup',full:'Full push-up, body straight',adv:'Feet on a chair, slow 3-second lowering'},
 {n:'High knees',t:'C',a:'hk',full:'Knees to hip height, quick feet',adv:'Fast, drive the arms',q:'Marching knees, no hop',qa:'march'},
 {n:'Reverse lunge',t:'S',a:'lunge',full:'Alternate legs, back knee near floor',adv:'Walking lunges or jump lunges',advQ:'Slow alternating lunges, 3-second lowering'},
 {n:'Shadow boxing',t:'C',a:'box',full:'Jab-cross, hands back to chin',adv:'Punch fast, squat every 4 punches'},
 {n:'Superman',t:'S',a:'superman',full:'Lift chest and legs, hold 2 s',adv:'Hold 3 s, arms reaching forward'},
 {n:'Skater hops',t:'C',a:'skater',full:'Step side to side, reach low',adv:'Big jumps side to side',q:'Side step and reach, no jump'},
 {n:'Plank',t:'S',a:'plank',full:'Elbows under shoulders, hips level',adv:'Side plank (switch halfway) or shoulder taps',hAdv:1},
 {n:'Mountain climbers',t:'C',a:'mc',full:'Steady pace, hips low',adv:'Fast, or cross-body knee to elbow',q:'Slow step-ins, one foot at a time'}
];
const WARM=[{n:'March in place',a:'march',how:'Knees up, swing arms'},{n:'Arm circles',a:'arms',how:'Small circles, switch direction halfway',sw:'Switch direction'},{n:'Slow squats',a:'squat',how:'Easy pace, loosen the hips'}];
const COOL=[{n:'Quad stretch',a:'quad',how:'Heel to glute, switch legs halfway',sw:'Switch legs'},{n:'Chest stretch',a:'chest',how:'Hands clasped behind, chest up'}];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const R=(note)=>({k:'rest',note});
const H=(rounds,work,rest,lvl,note)=>({k:'hyb',rounds,work,rest,lvl,note});
const EASY={k:'walk',min:10,note:'Easy day: 10-min walk after lunch, stretch if sore'};
const OPT='Optional, only if you have time';
const PLAN=[
 {name:'Weeks 1–4',d:[H(2,40,20,'full'),H(2,40,20,'full'),EASY,H(2,40,20,'full'),R('Travel day'),H(2,40,20,'full',OPT),R('Rest and meal prep')]},
 {name:'Weeks 5–8',d:[H(3,40,20,'full'),H(3,40,20,'full'),EASY,H(3,40,20,'full'),R('Travel day'),H(3,40,20,'full',OPT),R('Rest and meal prep')]},
 {name:'Weeks 9–12',d:[H(3,45,15,'adv'),H(3,45,15,'adv'),EASY,H(3,45,15,'adv'),R('Travel day'),H(3,45,15,'adv',OPT),R('Rest and meal prep')]}
];

const opt={beep:true,voice:true,vib:true,wake:true,quiet:false,...store.get('opt',{})};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=new Date();const todayIdx=(today.getDay()+6)%7;
function mondayOf(d){const m=new Date(d);m.setHours(0,0,0,0);m.setDate(m.getDate()-((m.getDay()+6)%7));return m}
let start=store.get('start',null);if(!start){start=iso(mondayOf(today));store.set('start',start)}
function weekNo(){const s=new Date(start+'T00:00:00');const t=new Date(iso(today)+'T00:00:00');return Math.max(1,Math.floor((t-s)/864e5/7)+1)}
const autoBlock=()=>{const w=weekNo();return w<=4?0:w<=8?1:2};
let block=autoBlock(),day=todayIdx;

let phases=[],idx=0,remain=0,running=false,last=0,timer=null,wake=null,actx=null,sess=null;
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

function buildSession(){
 const s=PLAN[block].d[day];const P=[];const ready={type:'ready',label:'Get ready',what:'',how:'',dur:10};
 if(s.k==='rest')return{s,title:'Rest day',sub:s.note,phases:[],list:''};
 if(s.k==='hyb'){
  const q=opt.quiet,adv=s.lvl==='adv';
  const mv=MOVES.map(m=>({...m,how:adv?((q&&(m.advQ||m.q))||m.adv):((q&&m.q)||m.full),anim:(q&&m.qa)||m.a,half:adv&&m.hAdv}));
  P.push({...ready,what:'Warm-up',how:'March in place first',a:'march'});
  WARM.forEach(w=>P.push({type:'warm',label:'Warm-up',what:w.n,how:w.how,dur:60,a:w.a,sw:w.sw}));
  for(let r=1;r<=s.rounds;r++)mv.forEach((m,i)=>{
   const st=m.t==='S';
   P.push({type:st?'work':'cardio',label:`Round ${r}/${s.rounds} · ${st?'Strength':'Cardio'}`,what:m.n,how:m.how,dur:s.work,half:!!m.half,a:m.anim});
   if(i<mv.length-1)P.push({type:'rest',label:'Rest',what:'Breathe',how:'',dur:s.rest,a:mv[i+1].anim,nx:mv[i+1].n});
   else if(r<s.rounds)P.push({type:'brk',label:'Round break',what:'1 minute',how:'Water, shake it out',dur:60,a:mv[0].anim,nx:mv[0].n});
  });
  COOL.forEach(c=>P.push({type:'cool',label:'Cool-down',what:c.n,how:c.how,dur:60,a:c.a,sw:c.sw}));
  const li=(a,n,sub)=>`<li class="mv"><svg class="mini" viewBox="0 10 120 155" data-a="${a}" aria-hidden="true"><g></g></svg><div><b>${n}</b><span>${sub}</span></div></li>`;
  const list=`<li class="ex"><b>Warm-up · 3 min</b><span>${WARM.map(w=>w.n).join(', ')}</span></li>`+mv.map(m=>li(m.anim,m.n,(m.t==='S'?'Strength':'Cardio')+' · '+m.how)).join('')+`<li class="ex"><b>Cool-down · 2 min</b><span>${COOL.map(c=>c.n).join(', ')}</span></li>`;
  return{s,title:`Hybrid circuit · ${s.rounds} rounds${adv?' · Advanced':''}${q?' · Quiet':''}`,sub:(s.note?s.note+' · ':'')+`${s.work} s work, ${s.rest} s rest, strength and cardio alternate`,phases:P,list};
 }
 if(s.k==='walk'){
  P.push({...ready,what:'Brisk walk',how:'Talk-but-not-sing pace'});
  const seg=s.min>=30?10:5,n=Math.ceil(s.min/seg);
  for(let i=1;i<=n;i++){const m=Math.min(seg,s.min-(i-1)*seg);P.push({type:'walk',label:`Brisk walk ${i}/${n}`,what:'Brisk walk',how:'You can talk but not sing',dur:m*60})}
  return{s,title:`Brisk walk · ${s.min} min`,sub:s.note||'Brisk = you can talk but not sing',phases:P,list:''};
 }
 /* walk-jog */
 P.push({...ready,what:'Walk-jog',how:'Starts with an easy walk'});
 const warm=Math.max(2,s.wk)*60,pair=(s.jog+s.wk)*60;let left=s.min*60-warm;
 P.push({type:'walk',label:'Warm-up walk',what:'Easy walk',how:'Loosen up',dur:warm});
 const n=Math.floor(left/pair);
 for(let i=1;i<=n;i++){P.push({type:'jog',label:`Jog ${i}/${n}`,what:'Jog',how:'Easy, steady pace',dur:s.jog*60});P.push({type:'walk',label:`Walk ${i}/${n}`,what:'Walk',how:'Recover, keep moving',dur:s.wk*60})}
 left-=n*pair;if(left>0)P.push({type:'cool',label:'Cool-down',what:'Easy walk',how:'Bring the heart rate down',dur:left});
 return{s,title:`Walk-jog · ${s.min} min`,sub:(s.note?s.note+' · ':'')+`${s.jog} min jog / ${s.wk} min walk × ${n}`,phases:P,list:''};
}
const total=()=>phases.reduce((a,b)=>a+b.dur,0);

function setColour(type){
 const c=COL[type]||COL.ready;document.documentElement.style.setProperty('--stage',c);
 const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',c);
}
function renderStrip(){
 const T=total()||1;
 $('strip').innerHTML=phases.map((p,i)=>`<i class="${i<idx?'done':''} ${i===idx&&running?'now':''}" style="width:${p.dur/T*100}%;background:${COL[p.type]}"></i>`).join('');
 const used=[...new Set(phases.map(p=>p.type))];
 $('legend').innerHTML=used.map(t=>`<span><b style="background:${COL[t]}"></b>${NAME[t]}</span>`).join('');
}
function renderClock(){
 const p=phases[idx];
 if(!phases.length){setColour('ready');$('phase').textContent='Rest day';$('time').textContent='—';$('what').textContent=sess.sub||'Recover';$('how').textContent='Pick another day to train anyway';setFig(null);$('next').textContent='';$('arc').style.strokeDashoffset=0;$('elapsed').textContent='';$('left').textContent='';return}
 if(!p){setColour('done');$('phase').textContent='Done';$('time').textContent='✓';$('what').textContent='Great work!';$('how').textContent='Session logged for today';setFig(null);$('next').textContent='';$('arc').style.strokeDashoffset=0;return}
 setColour(running||idx>0||remain<p.dur?p.type:'ready');
 $('phase').textContent=p.label;$('time').textContent=fmt(remain);$('what').textContent=p.what;$('how').textContent=p.how;
 const n=phases[idx+1];$('next').textContent=n?'Next: '+(n.a&&n.type!=='rest'&&n.type!=='brk'?n.what:NAME[n.type]):'Last one!';
 setFig(p.a,p.nx?'Next: '+p.nx:p.type==='ready'?'First: march in place':p.what);
 $('arc').style.strokeDashoffset=565.5*(1-remain/p.dur);
 const done=phases.slice(0,idx).reduce((a,b)=>a+b.dur,0)+(p.dur-remain);
 $('elapsed').textContent='Elapsed '+fmt(done);$('left').textContent='Left '+fmt(total()-done);
}
function renderAll(){renderStrip();renderClock()}

function beep(f=880,d=.12){if(!opt.beep||!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function say(t){if(!opt.voice||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}
function vib(p){if(!opt.vib)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
async function keepAwake(on){try{if(on&&opt.wake&&navigator.wakeLock)wake=await navigator.wakeLock.request('screen');else if(!on&&wake){await wake.release();wake=null}}catch(e){}}

function cue(p,i){
 if(p.type==='work'||p.type==='cardio')return p.what;
 if(p.type==='warm')return (phases[i-1]?.type!=='warm'?'Warm-up. ':'')+p.what;
 if(p.type==='cool'&&p.a)return (phases[i-1]?.type!=='cool'?'Cool-down. ':'')+p.what;
 if(p.type==='rest')return 'Rest. Next, '+(phases[i+1]?.what||'');
 if(p.type==='brk')return 'Round break. One minute. Next, '+(phases[i+1]?.label||'');
 if(p.type==='jog')return 'Jog';
 if(p.type==='walk')return p.label.startsWith('Brisk')?(i>1?`${Math.round(phases.slice(1,i).reduce((a,b)=>a+b.dur,0)/60)} minutes done. Keep going.`:'Brisk walk. Go.'):p.label.startsWith('Warm')?'Warm-up walk':'Walk';
 if(p.type==='cool')return 'Cool-down. Easy walk.';
 return p.label;
}
function finish(){
 running=false;clearInterval(timer);$('go').textContent='Start';beep(660,.3);setTimeout(()=>beep(990,.4),300);vib([300,150,300,150,600]);
 say('Workout complete. Great job.');keepAwake(false);
 const log=store.get('log',{});log[iso(new Date())]=sess.title;store.set('log',log);renderWeek();renderAll();
}
function enter(i){
 idx=i;const p=phases[i];if(!p){finish();return}
 remain=p.dur;p.hd=false;beep(p.type==='work'||p.type==='jog'||p.type==='cardio'?1040:620,.25);
 vib(p.type==='work'||p.type==='jog'||p.type==='cardio'?[250,120,250]:400);say(cue(p,i));renderAll();
}
function tick(){
 const now=Date.now(),dt=(now-last)/1000;last=now;const p=phases[idx];
 const before=Math.ceil(remain);remain-=dt;
 if(remain>0){
  if((p.type==='work'||p.type==='cardio'||p.sw)&&!p.hd&&remain<=p.dur/2){p.hd=true;say(p.sw||(p.half?'Switch sides':'Halfway'));vib(80)}
  const after=Math.ceil(remain);if(after!==before&&after<=3){beep(880,.1);vib(60)}
  renderClock();return}
 let over=-remain,i=idx+1;
 while(i<phases.length&&over>=phases[i].dur){over-=phases[i].dur;i++}
 enter(i);if(phases[i]){remain-=over;renderClock()}
}
function startT(){
 if(!phases.length)return;
 if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
 try{actx&&actx.resume()}catch(e){}
 if(idx>=phases.length){idx=0;remain=phases[0].dur}
 const fresh=remain===phases[idx].dur;
 running=true;last=Date.now();timer=setInterval(tick,200);$('go').textContent='Pause';
 if(fresh)enter(idx);keepAwake(true);renderAll();
}
function pause(){running=false;clearInterval(timer);$('go').textContent='Resume';keepAwake(false);setColour('ready');renderStrip()}
function reset(){
 running=false;clearInterval(timer);sess=buildSession();phases=sess.phases;idx=0;remain=phases[0]?.dur||0;
 $('go').textContent='Start';$('go').disabled=!phases.length;$('skip').disabled=!phases.length;
 try{speechSynthesis.cancel()}catch(e){}keepAwake(false);
 $('sumline').textContent=`Week ${weekNo()} · ${DAYS[day]}${phases.length?' · '+fmt(total()):''}`;
 renderSess();renderAll();
 if(phases.length){$('phase').textContent='Ready';$('what').textContent=sess.title;$('how').textContent='Press start';$('next').textContent=''}
}

const ST={h:[64,44],s:[62,61],p:[60,96],kn:[60,124],fn:[60,153],kf:[57,124],ff:[57,153],en:[63,79],hn:[65,96],ef:[60,79],hf:[62,96]};

const MA={...HKA,kn:[76,106],fn:[76,134],en:[56,78],hn:[54,94],ef:[68,78],hf:[72,92]},MB={...HKB,kf:[76,106],ff:[76,134],ef:[56,78],hf:[54,94],en:[68,78],hn:[72,92]};
const FC={h:[60,42],s:[60,58],p:[60,100],sN:[68,60],sF:[52,60],pN:[64,100],pF:[56,100],kn:[65,126],fn:[66,153],kf:[55,126],ff:[54,153],en:[72,78],hn:[73,96],ef:[48,78],hf:[47,96]};
const JO={h:[60,35],s:[60,51],p:[60,93],sN:[68,53],sF:[52,53],pN:[64,93],pF:[56,93],kn:[72,119],fn:[80,146],kf:[48,119],ff:[40,146],en:[78,38],hn:[84,20],ef:[42,38],hf:[36,20]};
const PU={h:[106,108],s:[94,116],p:[58,130],kn:[37,140],fn:[16,150],kf:[37,140],ff:[16,150],en:[94,135],hn:[94,153],ef:[91,135],hf:[91,153]};
const PD={h:[107,133],s:[94,139],p:[58,142],kn:[37,146],fn:[16,150],kf:[37,146],ff:[16,150],en:[80,140],hn:[92,153],ef:[77,140],hf:[89,153]};
const LU={h:[56,67],s:[55,84],p:[52,120],kf:[78,121],ff:[78,153],kn:[40,148],fn:[16,152],en:[54,102],hn:[57,118],ef:[52,102],hf:[55,118]};
const BG={h:[62,44],s:[60,61],p:[58,96],kn:[68,125],fn:[72,153],kf:[50,125],ff:[46,153],en:[64,80],hn:[72,64],ef:[60,80],hf:[68,66]};
const BJ={...BG,en:[80,62],hn:[99,60]},BC={...BG,s:[62,61],ef:[78,62],hf:[97,60]};
const SR={h:[99,143],s:[86,148],p:[54,148],kn:[31,150],fn:[8,151],kf:[31,150],ff:[8,151],en:[101,150],hn:[115,150],ef:[100,150],hf:[114,150]};
const SU={h:[97,131],s:[84,140],p:[54,149],kn:[31,145],fn:[9,137],kf:[31,145],ff:[9,137],en:[99,133],hn:[113,126],ef:[98,133],hf:[112,126]};
const SKL={h:[44,52],s:[46,68],p:[50,104],sN:[53,70],sF:[39,70],pN:[54,104],pF:[46,104],kf:[42,128],ff:[40,153],kn:[52,130],fn:[30,152],en:[50,90],hn:[40,108],ef:[30,78],hf:[20,68]};
const SKM={h:[60,40],s:[60,56],p:[60,94],sN:[67,58],sF:[53,58],pN:[64,94],pF:[56,94],kn:[66,120],fn:[68,144],kf:[54,120],ff:[52,144],en:[72,74],hn:[78,88],ef:[48,74],hf:[42,88]};
const PL={h:[104,116],s:[92,123],p:[58,133],kn:[36,142],fn:[14,151],kf:[36,142],ff:[14,151],en:[92,150],hn:[110,150],ef:[90,150],hf:[108,150]};
const PL2={...PL,p:[58,130],h:[104,115]};

const MC1={...MCB,kn:[80,134],fn:[68,150],kf:[38,138],ff:[16,151]},MC2={...MCB,kf:[80,134],ff:[68,150],kn:[38,138],fn:[16,151]};
const ac=(a)=>{const r=6,cx=96,cy=60,hx=cx+r*Math.cos(a),hy=cy+r*Math.sin(a);return {...FC,sN:[68,60],sF:[52,60],en:[(68+hx)/2,(60+hy)/2],hn:[hx,hy],ef:[120-(68+hx)/2,(60+hy)/2],hf:[120-hx,hy]}};
const AC=[0,1.57,3.14,4.71].map(ac);
const QS={h:[63,44],s:[61,61],p:[60,96],kf:[60,124],ff:[60,153],kn:[57,124],fn:[46,100],en:[52,84],hn:[46,100],ef:[72,72],hf:[86,68]};
const QS2={...QS,h:[64,44],ef:[73,71],hf:[88,67]};
const CS={h:[67,43],s:[64,60],p:[60,96],kn:[60,124],fn:[60,153],kf:[57,124],ff:[57,153],en:[50,74],hn:[40,88],ef:[48,75],hf:[38,89]};
const CS2={...CS,hn:[39,83],hf:[37,84],en:[50,72],ef:[48,73]};
const ANIM={
 march:{v:'side',hl:['thighN','thighF'],sq:[[MA,.5],[MB,.5]]},
 arms:{v:'front',hl:['uaN','faN','uaF','faF'],sq:AC.map(p=>[p,.22]),lin:1},
 squat:{v:'side',hl:['thighN','thighF'],sq:[[ST,.4],[SQ,1.3],[SQ,.3],[ST,1.2]]},
 jj:{v:'front',hl:['thighN','shinN','thighF','shinF'],sq:[[FC,.42],[JO,.42]]},
 pushup:{v:'side',toe:0,hl:['uaN','faN','uaF','faF','torso'],sq:[[PU,.4],[PD,1.1],[PD,.2],[PU,.9]]},
 hk:{v:'side',hl:['thighN','thighF'],sq:[[HKA,.32],[HKB,.32]]},
 lunge:{v:'side',hl:['thighN','thighF'],sq:[[ST,.4],[LU,1.1],[LU,.3],[ST,1]]},
 box:{v:'side',hl:['uaN','faN','uaF','faF'],sq:[[BG,.3],[BJ,.18],[BG,.22],[BC,.18],[BG,.22]]},
 superman:{v:'side',toe:0,hl:['torso','thighN','thighF'],sq:[[SR,.6],[SU,.9],[SU,1.5],[SR,.8]]},
 skater:{v:'front',hl:['thighN','thighF'],sq:[[SKL,.35],[SKL,.15],[SKM,.25],[mir(SKL),.25],[mir(SKL),.15],[SKM,.25]]},
 plank:{v:'side',toe:0,hl:['torso'],sq:[[PL,1.2],[PL2,1.2]]},
 mc:{v:'side',toe:0,hl:['torso','thighN','thighF'],sq:[[MC1,.3],[MC2,.3]]},
 quad:{v:'side',hl:['thighN'],sq:[[QS,1.4],[QS2,1.4]]},
 chest:{v:'side',hl:['torso','uaN','uaF'],sq:[[CS,1.4],[CS2,1.4]]}
};
for(const k in ANIM)ANIM[k].tot=ANIM[k].sq.reduce((a,b)=>a+b[1],0);
const fillP=P=>({...P,sN:P.sN||P.s,sF:P.sF||P.s,pN:P.pN||P.p,pF:P.pF||P.p});
const lerpP=(A,B,t)=>{const o={};A=fillP(A);B=fillP(B);for(const k in A)o[k]=[A[k][0]+(B[k][0]-A[k][0])*t,A[k][1]+(B[k][1]-A[k][1])*t];return o};
const easeP=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const ln=(a,b,w,c)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const dot=(a,r,c)=>`<circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="${r}" fill="${c}"/>`;
function poseAt(m,t){let x=t%m.tot,k=0;while(x>m.sq[k][1]){x-=m.sq[k][1];k++}const A=m.sq[(k-1+m.sq.length)%m.sq.length][0],u=x/m.sq[k][1];return lerpP(A,m.sq[k][0],m.lin?u:easeP(u))}
function drawFig(key,t){
 const m=ANIM[key];if(!m)return'';const P=poseAt(m,t),hl=new Set(m.hl),fr=m.v==='front';
 const cN=k=>hl.has(k)?FR:FK,cF=k=>hl.has(k)?(fr?FR:FRL):(fr?FK:FG);
 const toe=(f,c)=>m.toe===0||fr||f[1]<147?'':ln(f,[f[0]+9,f[1]+1],5,c);
 return ln(P.pF,P.kf,10,cF('thighF'))+ln(P.kf,P.ff,8,cF('shinF'))+toe(P.ff,cF('shinF'))
  +ln(P.sF,P.ef,7,cF('uaF'))+ln(P.ef,P.hf,6,cF('faF'))+dot(P.hf,3.5,cF('faF'))
  +ln(P.p,P.s,fr?18:15,cN('torso'))
  +ln(P.pN,P.kn,10,cN('thighN'))+ln(P.kn,P.fn,8,cN('shinN'))+toe(P.fn,cN('shinN'))
  +ln(P.sN,P.en,7,cN('uaN'))+ln(P.en,P.hn,6,cN('faN'))+dot(P.hn,3.5,cN('faN'))
  +dot(P.h,11,FK);
}
let figKey=null;
function setFig(key,label){figKey=key&&ANIM[key]?key:null;$('figbox').style.display=figKey?'':'none';if(figKey)$('figlbl').textContent=label||''}
const still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function animLoop(ts){
 const t=still?0:ts/1000;
 if(figKey)$('bigg').innerHTML=drawFig(figKey,t);
 document.querySelectorAll('svg.mini').forEach(sv=>{sv.firstChild.innerHTML=drawFig(sv.dataset.a,t)});
 requestAnimationFrame(animLoop);
}
requestAnimationFrame(animLoop);

/* setup UI */
function renderChips(){
 const ab=autoBlock();
 $('blocks').innerHTML=PLAN.map((b,i)=>`<button class="chip ${i===ab?'today':''}" data-b="${i}" aria-pressed="${i===block}">${b.name}</button>`).join('');
 $('days').innerHTML=DAYS.map((d,i)=>`<button class="chip ${i===todayIdx?'today':''}" data-d="${i}" aria-pressed="${i===day}">${d}</button>`).join('');
}
function renderSess(){
 $('sess').innerHTML=`<h3>${sess.title}</h3><p class="dur">${sess.phases.length?fmt(sess.phases.reduce((a,b)=>a+b.dur,0))+' · ':''}${sess.sub||''}</p>${sess.list?`<ul class="moves">${sess.list}</ul>`:''}`;
}
function renderWeek(){
 const log=store.get('log',{});const m=mondayOf(today);
 $('week').innerHTML=DAYS.map((d,i)=>{const dt=new Date(m);dt.setDate(m.getDate()+i);const k=iso(dt);const ok=log[k];
  const plan=PLAN[autoBlock()].d[i];const tag=plan.k==='rest'?'Rest':plan.k==='hyb'?(plan.note?'Opt.':'Hybrid'):plan.k==='walk'?(plan.min<=10?'Easy':'Walk'):'W-J';
  return `<div class="${ok?'ok':''} ${i===todayIdx?'td':''}" title="${ok||''}"><b>${ok?'✓':dt.getDate()}</b>${d}<br>${tag}</div>`}).join('');
 const w=weekNo();$('wkinfo').textContent=w>12?`Week ${w}: 12-week plan finished, keep going with Weeks 9–12`:`Week ${w} of 12 · ${PLAN[autoBlock()].name}`;
}
$('blocks').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;block=+b.dataset.b;renderChips();reset()});
$('days').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;day=+b.dataset.d;renderChips();reset()});
$('start').value=start;
$('start').addEventListener('change',()=>{if(!$('start').value)return;start=$('start').value;store.set('start',start);block=autoBlock();renderChips();renderWeek();reset()});
$('go').addEventListener('click',()=>running?pause():startT());
$('skip').addEventListener('click',()=>{if(idx<phases.length){enter(idx+1);if(running)last=Date.now()}});
$('reset').addEventListener('click',reset);
[['t-beep','beep'],['t-voice','voice'],['t-vib','vib'],['t-wake','wake'],['t-quiet','quiet']].forEach(([id,k])=>{$(id).checked=opt[k];$(id).addEventListener('change',()=>{opt[k]=$(id).checked;store.set('opt',opt)})});
$('t-quiet').addEventListener('change',()=>{if(!running)reset()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running)keepAwake(true)});

let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').style.display='inline-flex'});
$('install').addEventListener('click',async()=>{if(!deferred)return;try{deferred.prompt();await deferred.userChoice}catch(e){}deferred=null;$('install').style.display='none'});
window.addEventListener('appinstalled',()=>{$('install').style.display='none'});
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}

renderChips();renderWeek();reset();
}
